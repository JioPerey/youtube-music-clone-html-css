<!DOCTYPE html>
<html>
  <head>
    <title>Library | YouTube Music Clone</title>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/chips-section.css">
  </head>
  <body>
    <header>
      <section class="left-section">
        <div class="hamburger-menu-container">
          <img class="hamburger-menu" src="icons/hambuger-menu-icon.svg" alt="hamburger menu">
        </div>
        <a href="index.html">
          <img class="youtube-music-logo" src="icons/youtube-music-logo.svg" alt="youtube music logo">
        </a>
        <div class="search-container">
          <img class="search-icon" src="icons/search-icon.svg" alt="search icon">
          <input class="search-input" type="text" placeholder="Search songs, albums, artists, podcasts">
        </div>
      </section>
      <section class="right-section">
        <div class="cast-button">
          <img class="cast-icon" src="icons/cast-icon.svg" alt="cast icon">
        </div>
        <div class="current-user-profile-container">
          <img  class="current-user-profile" src="channel-pictures/my-channel.jpg" alt="current user channel">
        </div>
      </section>
    </header>
    
    <nav>
      <a href="index.html" class="nav-link" >
        <img src="icons/home-icon.svg" alt="home icon">
        <p>Home</p>
      </a>
      <a href="explore.html" class="nav-link">
        <img class="explore-icon" src="icons/explore-icon.svg" alt="explore icon">
        <p>Explore</p>
      </a>
      <a href="library.html" class="nav-link active">
        <img class="library-icon" src="icons/library-icon-filled.svg" alt="library icon">
        <p>Library</p>
      </a>
      <a class="nav-link" href="https://music.youtube.com/music_premium/musicfeed">
        <img class="youtube-music-icon" src="icons/youtube-music.svg" alt="youtube music icon">
        <p>Upgrade</p>
      </a>
    </nav>
  </body>
</html>
